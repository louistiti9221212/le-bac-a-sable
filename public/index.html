<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALPHA BLITZ — Le Bac à Sable</title>
<meta name="theme-color" content="#7657ff">

<style>
:root {
  --bg:#f5f3ff;
  --card:#ffffff;
  --ink:#24213d;
  --muted:#77758f;
  --purple:#7657ff;
  --pink:#ff65a3;
  --blue:#4bbdff;
  --green:#4bd6a0;
  --yellow:#ffcf56;
  --shadow:0 12px 32px #46358b16;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(circle at 8% 5%,#ffe0ef 0,transparent 23%),
    radial-gradient(circle at 95% 10%,#dcd6ff 0,transparent 25%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
}
button,input,select {font:inherit}
button {cursor:pointer;border:0}
button:disabled {opacity:.45;cursor:not-allowed}
.topbar {
  max-width:1200px;margin:auto;padding:18px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand {display:flex;align-items:center;gap:10px;font-weight:1000;font-size:21px}
.brand-icon {
  width:44px;height:44px;display:grid;place-items:center;
  border-radius:15px;background:linear-gradient(135deg,var(--purple),var(--pink));
  color:white;font-size:24px;box-shadow:0 7px 18px #7657ff44;
}
.pill {background:white;padding:10px 14px;border-radius:999px;font-weight:800;box-shadow:var(--shadow)}
main {max-width:1100px;margin:auto;padding:15px 22px 55px}
.view {display:none}
.view.active {display:block;animation:appear .3s ease}
@keyframes appear {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1 {font-size:clamp(32px,6vw,60px);line-height:1.02;letter-spacing:-2px;margin:12px 0}
h2 {letter-spacing:-.7px}
p {line-height:1.6}
.muted {color:var(--muted)}
.hero {text-align:center;padding:25px 0 30px}
.hero p {max-width:560px;margin:15px auto;color:var(--muted)}
.gradient-text {background:linear-gradient(90deg,#7657ff,#ff65a3);background-clip:text;color:transparent}
.panel {
  background:var(--card);border:1px solid #ffffffcc;border-radius:25px;
  padding:23px;box-shadow:var(--shadow);margin:15px 0;
}
.grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.actions {display:flex;gap:10px;flex-wrap:wrap}
.btn {
  padding:13px 18px;border-radius:15px;font-weight:850;
  transition:transform .15s,filter .15s;display:inline-flex;
  justify-content:center;align-items:center;gap:8px;
}
.btn:hover {transform:translateY(-2px);filter:brightness(1.03)}
.btn:disabled:hover {transform:none;filter:none}
.primary {background:linear-gradient(135deg,var(--purple),#9c6bff);color:white;box-shadow:0 7px 16px #7657ff30}
.pink {background:linear-gradient(135deg,var(--pink),#ff8dba);color:white}
.green {background:linear-gradient(135deg,#36c993,#77e4b7);color:#123e30}
.yellow {background:linear-gradient(135deg,#ffcf56,#ffdf8b);color:#5a4100}
.light {background:#f0edff;color:#5b48bf}
.danger {background:#ffe9ef;color:#b92c59}
.full {width:100%}
.field {display:flex;flex-direction:column;gap:7px;margin:12px 0}
.field label {font-size:13px;font-weight:850;color:var(--muted)}
.field input,.field select {
  width:100%;padding:13px 14px;border:2px solid #eeebfa;
  border-radius:13px;outline:none;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus {border-color:var(--purple)}
.row {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status {font-size:13px;font-weight:800;color:var(--muted);margin-top:12px}
.status.error {color:#d83d68}
.status.ok {color:#16966a}
.badge {padding:6px 10px;background:#f0edff;color:#6652ce;border-radius:999px;font-size:12px;font-weight:900}
.avatar-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.avatar-option {
  background:#faf9ff;border:2px solid transparent;border-radius:18px;
  padding:8px;min-width:0;text-align:center;color:var(--ink);font-weight:800;
}
.avatar-option.selected {border-color:var(--purple);background:#f0edff}
.avatar-option canvas {width:100%;height:105px;display:block}
.avatar-option span {font-size:12px}
.stage {
  background:linear-gradient(140deg,#ece7ff,#ffe5f0);
  border-radius:24px;overflow:hidden;position:relative;min-height:260px;
}
.stage canvas {width:100%;height:280px;display:block}
.monster-stage {width:100%;height:210px}
.player-list {display:grid;gap:9px}
.player {
  display:flex;align-items:center;gap:12px;padding:12px;
  background:#faf9ff;border-radius:15px;
}
.player canvas {width:65px;height:65px}
.player-info {flex:1;min-width:0}
.player-name {font-weight:900;overflow-wrap:anywhere}
.player-state {font-size:12px;color:var(--muted)}
.big-number {font-size:clamp(35px,8vw,68px);font-weight:1000;letter-spacing:-2px}
.countdown {font-size:90px;font-weight:1000;color:var(--purple);text-align:center}
.wheel-wrap {max-width:420px;margin:20px auto;text-align:center}
.wheel {
  width:min(78vw,340px);aspect-ratio:1;margin:15px auto;
  border-radius:50%;border:9px solid white;
  background:conic-gradient(
    #ff709e 0deg 12deg,#ffca57 12deg 24deg,
    #67dcb0 24deg 36deg,#62c9ff 36deg 48deg,
    #a68bff 48deg 60deg,#ff8fcb 60deg 72deg,
    #ffcf68 72deg 84deg,#64dcb9 84deg 96deg,
    #62c9ff 96deg 108deg,#aa92ff 108deg 120deg,
    #ff709e 120deg 132deg,#ffca57 132deg 144deg,
    #67dcb0 144deg 156deg,#62c9ff 156deg 168deg,
    #a68bff 168deg 180deg,#ff8fcb 180deg 192deg,
    #ffcf68 192deg 204deg,#64dcb9 204deg 216deg,
    #62c9ff 216deg 228deg,#aa92ff 228deg 240deg,
    #ff709e 240deg 252deg,#ffca57 252deg 264deg,
    #67dcb0 264deg 276deg,#62c9ff 276deg 288deg,
    #a68bff 288deg 300deg,#ff8fcb 300deg 312deg,
    #ffcf68 312deg 324deg,#64dcb9 324deg 336deg,
    #62c9ff 336deg 348deg,#aa92ff 348deg 360deg
  );
  box-shadow:0 12px 25px #59439b30;position:relative;
  transition:transform 4s cubic-bezier(.12,.72,.08,1);
}
.wheel:after {
  content:"🎲";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);font-size:40px;
  width:72px;height:72px;border-radius:50%;background:white;
  display:grid;place-items:center;border:5px solid #eee8ff;
}
.pointer {font-size:28px;color:#7657ff;line-height:1}
.theme-display {
  background:linear-gradient(120deg,#7657ff,#ff65a3);
  color:white;padding:20px;border-radius:20px;text-align:center;
}
.theme-display strong {font-size:clamp(24px,5vw,38px)}
.picked {display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.chip {padding:6px 11px;border-radius:999px;background:#f0edff;color:#5b48bf;font-size:12px;font-weight:850}
.chip.empty {background:#faf9ff;color:#b6b3cc;border:1px dashed #d9d5ee}
.answer-grid {display:grid;gap:10px}
.answer-row {
  display:grid;grid-template-columns:minmax(90px,.8fr) minmax(120px,1.5fr);
  gap:10px;align-items:center;padding:12px;background:#faf9ff;border-radius:13px;
}
.answer-row label {font-size:12px;font-weight:850;color:var(--muted)}
.answer-row input {width:100%;padding:10px;border:2px solid #eeebfa;border-radius:10px}
.vote-card {border:2px solid #efecfa;border-radius:17px;padding:14px;margin:10px 0}
.vote-buttons {display:flex;gap:8px;margin-top:10px}
.vote-buttons button {flex:1}
.result-row {display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #f0edf8}
.result-block {padding:12px 0;border-bottom:1px solid #f0edf8}
.result-detail {display:grid;gap:4px;margin-top:8px;font-size:13px}
.result-detail div {display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.result-detail .ok {color:#16966a;font-weight:800}
.result-detail .ko {color:#b92c59;text-decoration:line-through}
.coin {color:#b17b00;font-weight:950}
.shop-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.shop-item {padding:14px;background:#faf9ff;border-radius:16px;text-align:center}
.shop-item .emoji {font-size:32px}
.shop-item select {width:100%;margin:6px 0;padding:8px;border-radius:10px;border:2px solid #eeebfa}
.shop-item .muted {font-size:12px;margin:4px 0}
.chat-log {max-height:150px;overflow:auto;background:#faf9ff;border-radius:13px;padding:10px;font-size:13px;line-height:1.5}
.chat-log .sys {color:var(--muted);font-style:italic}
.chat-form {display:flex;gap:8px;margin-top:10px}
.chat-form input {flex:1;padding:11px;border:2px solid #eeebfa;border-radius:12px;outline:none}
.toast {position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24213d;color:white;padding:13px 18px;border-radius:14px;z-index:99;max-width:90%;display:none}
.footer {text-align:center;font-size:12px;color:var(--muted);padding:25px}
@media(max-width:650px) {
  .grid {grid-template-columns:1fr}
  .avatar-grid {grid-template-columns:repeat(3,minmax(0,1fr))}
  .panel {padding:17px}
  .topbar {padding:13px}
  main {padding:8px 13px 35px}
  .shop-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
  .answer-row {grid-template-columns:1fr}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand"><div class="brand-icon">👾</div><div>ALPHA <span class="gradient-text">BLITZ</span><div class="muted" style="font-size:11px;letter-spacing:1px">LE BAC À SABLE</div></div></div>
  <div class="pill">🪙 <span id="coinCount">0</span></div>
</header>

<main>
  <!-- ACCUEIL -->
  <section class="view active" id="home">
    <div class="hero">
      <div class="badge">🎮 LE PETIT BAC MULTIJOUEUR</div>
      <h1>Prêt à jouer<br><span class="gradient-text">avec tes amis ?</span></h1>
      <p>Trouve les meilleures réponses, fais tourner la roue et défends tes idées face aux autres joueurs !</p>
    </div>
    <div class="grid">
      <div class="panel">
        <h2>🚀 Créer une partie</h2>
        <div class="field"><label>TON PSEUDO</label><input id="createName" maxlength="18" placeholder="Ex. Blitzo"></div>
        <div class="field"><label>NOMBRE DE MANCHES</label><select id="maxRounds"><option value="3">3 manches</option><option value="5" selected>5 manches</option><option value="10">10 manches</option></select></div>
        <div class="field"><label>DURÉE D'UNE MANCHE</label><select id="duration"><option value="30">30 secondes</option><option value="60" selected>60 secondes</option><option value="90">90 secondes</option></select></div>
        <button class="btn primary full" id="createBtn">Créer mon salon ✨</button>
      </div>
      <div class="panel">
        <h2>🎯 Rejoindre une partie</h2>
        <div class="field"><label>TON PSEUDO</label><input id="joinName" maxlength="18" placeholder="Ton pseudo"></div>
        <div class="field"><label>CODE DU SALON</label><input id="roomCode" maxlength="6" placeholder="ABC123" style="text-transform:uppercase"></div>
        <button class="btn pink full" id="joinBtn">Rejoindre mes amis 🎉</button>
